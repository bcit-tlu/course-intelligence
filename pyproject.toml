[project]
name = "course-intelligence"
version = "0.16.0"
description = "Course Intelligence — transforms instructional content into structured learning elements (LangGraph pipeline)"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "opentelemetry-instrumentation-redis>=0.48",
    "opentelemetry-instrumentation-sqlalchemy>=0.48",
    "opentelemetry-instrumentation-requests>=0.48",
    "opentelemetry-instrumentation-logging>=0.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
