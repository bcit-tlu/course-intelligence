{{- if .Values.gateway.enabled }}
{{- $fullname := include "course-intelligence-backend.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-gateway
  labels:
    {{- include "course-intelligence-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "course-intelligence-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "course-intelligence-backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: {{ include "course-intelligence-backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "python", "main.py", "gateway"]
          env:
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.port | quote }}
            {{- include "course-intelligence-backend.llmCredsEnv" . | nindent 12 }}
            {{- if .Values.observability.openTelemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.openTelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.openTelemetry.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "course-intelligence-backend.otelServiceName" (dict "ctx" . "component" "gateway") | quote }}
            {{- end }}
          envFrom:
            # Provider selection + Ollama/Azure non-secret settings.
            - configMapRef:
                name: {{ $fullname }}-config
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
