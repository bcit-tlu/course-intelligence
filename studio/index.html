<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Intelligence | BCIT</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config: nginx proxies /otel to the OTel collector (see
         default.conf.template). In dev (Vite), the endpoint is not set so
         frontend analytics is disabled gracefully. -->
    <script type="module">
      if (import.meta.env.PROD) {
        window.__OTEL_ENDPOINT__ = "/otel";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
