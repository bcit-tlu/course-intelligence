{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "course-intelligence-backend.fullname" . }}
  labels:
    {{- include "course-intelligence-backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "course-intelligence-backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /health
      interval: 30s
{{- end }}
