# Default values for the course-intelligence-backend chart.
# One image backs three roles (api / worker / gateway) — the role is
# selected by each Deployment's container command.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/course-intelligence/course-intelligence-api
  # Defaults to .Chart.AppVersion; pin to a released tag for reproducible deploys.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# ── LLM provider & gateway (Step 8) ─────────────────────────
# provider: "ollama" (dev), "azure" (pilot/prod), "litellm" (gateway), "mock" (testing).
# Credentials are injected into the worker and gateway pods (the worker runs
# the graph and calls the LLM provider directly today). See plans/step-08.
llm:
  provider: ollama
  gatewayUrl: ""            # defaults to the in-cluster gateway service
  ollama:
    baseUrl: "https://ollama.com"
    model: "gemma4:31b-cloud"
    apiKey: ""              # -> Secret key `api-key` / env OLLAMA_API_KEY
  azure:
    endpoint: ""
    apiVersion: "2024-06-01"
    deployment: ""
    embeddingDeployment: ""
    apiKey: ""              # -> Secret key `azure-openai-api-key` / env AZURE_OPENAI_API_KEY
  litellm:
    model: "default-fast"   # LiteLLM model alias (non-secret); API key/base URL come from envFrom
  # Name of a pre-existing Secret holding LLM credentials (keys:
  # api-key, azure-openai-api-key). When set, the chart references it
  # instead of creating its own (Vault-ready). Ignored when provider=litellm.
  existingSecret: ""

# ── LLM gateway deployment (Step 9) ─────────────────────────
gateway:
  enabled: true
  port: 8100
  resources: {}

# ── Background worker (Step 9) ──────────────────────────────
worker:
  enabled: true
  replicaCount: 1
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# ── PostgreSQL via CloudNative-PG (Step 5) ──────────────────
# pgvector is loaded via CNPG image-volume extensions, which REQUIRE:
#   - PostgreSQL 18+ (extension_control_path GUC, introduced in PG 18)
#   - Kubernetes 1.33+ with the ImageVolume feature enabled
#   - CloudNative-PG operator 1.29+
# On older clusters, set pgvector.enabled=false and point cluster.image at a
# custom operand image that already bundles postgresql-<major>-pgvector,
# then add `CREATE EXTENSION vector` to a postInitTemplateSQL of your own.
# PostgreSQL credentials use `course_intelligence` (database, username,
# password) — renamed from `dialog` during the full rebrand. Since the
# application is in beta with downtime/data loss acceptable, a clean rebuild
# was chosen over a data migration.
postgres:
  enabled: false
  # Used when postgres.enabled=false and postgres.existingSecret is empty.
  uri: "postgresql://course_intelligence:course_intelligence@localhost:5432/course_intelligence"
  # Name of a pre-existing Secret with key `uri` holding the DATABASE_URL.
  # When set, the chart references it instead of creating its own Secret
  # (Vault-ready). Works with postgres.enabled=false (external DB).
  existingSecret: ""
  cluster:
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  auth:
    database: course_intelligence
    username: course_intelligence
    password: course_intelligence
  pgvector:
    enabled: true
    # Extension image mounted as a CNPG image volume (must match the
    # operand's PG major version).
    image: ghcr.io/cloudnative-pg/pgvector:0.8.5-18-trixie
    # Extension version installed via the CNPG Database resource.
    version: "0.8.5"
  persistence:
    storageClass: ""
    size: 10Gi
  # Scheduling constraints for CNPG pods (maps to Cluster.spec.affinity).
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Redis (Step 6) ──────────────────────────────────────────
redis:
  enabled: false
  # Used when redis.enabled=false (external Redis).
  url: "redis://course-intelligence-backend-redis:6379/0"
  image: redis:7-alpine
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── MinIO object storage (Step 7) ───────────────────────────
minio:
  enabled: false
  image: minio/minio:latest
  mcImage: minio/mc:latest
  bucket: uploads
  # Root credentials for the in-cluster MinIO. Also used by the backend as
  # its S3 access/secret keys. Move these to a Secret / Vault for production
  # (see minio.existingSecret).
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  # Name of a pre-existing Secret with keys `root-user` and `root-password`.
  # When set, the chart references it instead of creating its own.
  existingSecret: ""
  # Used when minio.enabled=false (external S3).
  endpointUrl: ""
  persistence:
    size: 30Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Upload retention ────────────────────────────────────────
# Number of recent job uploads to retain in S3. Older uploads are
# purged from MinIO after each job completes; the Job row (and its
# Result rows via ON DELETE CASCADE) are also deleted from Postgres.
retentionCount: 10

# ── Probes ──────────────────────────────────────────────────
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# ── Observability ───────────────────────────────────────────
observability:
  openTelemetry:
    enabled: false
    # OTLP/HTTP endpoint of the cluster's OTel collector.
    endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318
    protocol: http/protobuf
  # Per-role service name override. Defaults to <release-name>-<role>.
  serviceName: ""
  serviceMonitor:
    enabled: false
  grafanaDashboards:
    enabled: false
