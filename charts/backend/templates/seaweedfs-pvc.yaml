{{- if .Values.seaweedfs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "course-intelligence-backend.fullname" . }}-seaweedfs
  labels:
    {{- include "course-intelligence-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.seaweedfs.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.seaweedfs.persistence.size }}
{{- end }}
