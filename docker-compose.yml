services:
  studio:
    build: ./studio
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://api:8000
      NGINX_DNS_RESOLVER: 127.0.0.11
      NGINX_LOCAL_RESOLVERS: 127.0.0.11
      OTEL_ENDPOINT: http://otel-collector:4318
      TENANT_ID: local-dev
    depends_on:
      - api
      - otel-collector

  api:
    build: .
    command: ["uv", "run", "python", "main.py", "api"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://course_intelligence:course_intelligence@db:5432/course_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
      LLM_GATEWAY_URL: http://llm-gateway:8100
      RETENTION_COUNT: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    # default: reach redis/db/gateway/otel; storage: reach seaweedfs S3.
    networks:
      - default
      - storage

  worker:
    build: .
    command: ["uv", "run", "python", "main.py", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://course_intelligence:course_intelligence@db:5432/course_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
      LLM_GATEWAY_URL: http://llm-gateway:8100
      RETENTION_COUNT: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    # default: reach redis/db/gateway/otel; storage: reach seaweedfs S3.
    networks:
      - default
      - storage

  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://course_intelligence:course_intelligence@db:5432/course_intelligence
    depends_on:
      db:
        condition: service_healthy

  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "main.py", "gateway"]
    ports:
      - "8100:8100"
    env_file: .env
    environment:
      GATEWAY_PORT: 8100

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: course_intelligence
      POSTGRES_USER: course_intelligence
      POSTGRES_PASSWORD: course_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Single-process SeaweedFS (master + volume + filer + S3 gateway).
  # S3_BUCKET is created at startup from the env var — no init container.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # Vendor-neutral S3_* env names; the wrapper translates to the AWS_*
    # names `weed mini` reads. ($$ escapes compose interpolation so the
    # shell resolves them at runtime.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY"
        export AWS_SECRET_ACCESS_KEY="$$S3_SECRET_KEY"
        exec /entrypoint.sh mini -dir=/data \
          -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "8333:8333"
    environment:
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
    volumes:
      - seaweedfs_data:/data
    # Storage-only network: `weed mini` also opens unauthenticated
    # listeners (master, volume, filer, admin UI) that serve object data
    # directly. Keeping this service off the default network means only
    # api/worker (the S3 clients) can reach it — the compose equivalent
    # of the chart's seaweedfs NetworkPolicy. The published localhost
    # port still works for ad-hoc aws-cli testing.
    networks:
      - storage
    # TCP readiness on the S3 port. curl (bundled in the image) exits 0 on
    # any HTTP response and 7 on connection-refused, so this passes once
    # the S3 gateway accepts connections — the admin identity is loaded
    # by then, and the bucket auto-creates on first admin upload.
    healthcheck:
      test: ["CMD", "curl", "-s", "--max-time", "2", "-o", "/dev/null", "http://localhost:8333/"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"     # Internal metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

volumes:
  pgdata:
  seaweedfs_data:

networks:
  storage: {}
