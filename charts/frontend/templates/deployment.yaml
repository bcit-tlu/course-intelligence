{{- $fullname := include "dialog-frontend.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "dialog-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dialog-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dialog-frontend.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the nginx template changes so envsubst re-runs
        # against the new upstream config (hriv pattern).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: {{ include "dialog-frontend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # Backend upstream for the nginx envsubst template. Prefers an
            # explicit override, otherwise the cluster-internal Service FQDN.
            - name: BACKEND_URL
              value: {{ include "dialog-frontend.backendUrl" . | quote }}
            # Opt-in flag for the nginx image's 15-local-resolvers.envsh,
            # which exports NGINX_LOCAL_RESOLVERS from /etc/resolv.conf.
            # Without it the variable is unset and the template's
            # `resolver ${NGINX_LOCAL_RESOLVERS}` crashes nginx at startup.
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "true"
          volumeMounts:
            # Shadow the image's baked-in template with the ConfigMap so the
            # upstream can change without an image rebuild.
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-templates
          configMap:
            name: {{ $fullname }}-nginx
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
