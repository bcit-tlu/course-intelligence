name: '[CI] Test, build & publish'

# PR runs show PR title; main runs show head commit subject.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Head build — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to least privilege; jobs elevate only when needed.
permissions:
  contents: read

jobs:
  # ── Quality gates ──────────────────────────────────────────

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest

  studio-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory until pre-existing lint errors are resolved.
      - name: Lint (ESLint)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Cache kubeconform schemas
        uses: actions/cache@v5
        with:
          path: /tmp/kubeconform-cache
          key: kubeconform-schemas-v0.6.7-${{ hashFiles('charts/**/Chart.yaml') }}
          restore-keys: |
            kubeconform-schemas-v0.6.7-

      - name: Lint all charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done

      # kubeconform schema downloads can be flaky on shared runners; keep the
      # strict helm lint above as the primary gate while schema validation
      # absorbs the remaining transient-download risk.
      - name: Validate rendered charts with kubeconform
        continue-on-error: true
        run: |
          mkdir -p /tmp/kubeconform-cache
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "::group::${name}"
            helm template test "$chart" \
              | kubeconform -cache /tmp/kubeconform-cache -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -ignore-missing-schemas
            echo "::endgroup::"
          done

  # ── Container image builds (reusable workflow) ─────────────

  build-backend:
    needs: [backend-tests]
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      component: backend
      image_name: course-intelligence-api
      context: .
    secrets: inherit

  build-studio:
    needs: [studio-checks]
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      component: studio
      image_name: course-intelligence-studio
      context: ./studio
    secrets: inherit

  # ── Helm chart publish (main push only) ────────────────────
  # Packages an RC chart per component, stamping --version / --app-version to
  # the RC image tag so the chart pulls the exact image built above. Release
  # (stable) chart publishing is handled by helm-publish.yaml.

  helm-publish:
    needs: [helm-lint, build-backend, build-studio]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - uses: sigstore/cosign-installer@v3

      - name: Cosign login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            cosign login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Helm login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            helm registry login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Package, push & sign charts
        shell: bash
        env:
          BACKEND_VERSION: ${{ needs.build-backend.outputs.rc_version }}
          STUDIO_VERSION: ${{ needs.build-studio.outputs.rc_version }}
          OCI_BASE: oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          declare -A VERSIONS=(
            [backend]="${BACKEND_VERSION}"
            [studio]="${STUDIO_VERSION}"
          )

          for component in backend studio; do
            VERSION="${VERSIONS[$component]}"
            if [[ -z "${VERSION}" ]]; then
              echo "No RC version for ${component} (no changes); skipping."
              continue
            fi

            CHART_DIR="charts/${component}"
            CHART_NAME=$(yq '.name' "${CHART_DIR}/Chart.yaml")
            DEST_DIR="/tmp/charts"
            mkdir -p "${DEST_DIR}"

            echo "::group::${CHART_NAME} ${VERSION}"

            helm dependency update "${CHART_DIR}" || true

            helm package "${CHART_DIR}" \
              --version "${VERSION}" \
              --app-version "${VERSION}" \
              -d "${DEST_DIR}"

            PUSH_OUT=$(helm push \
              "${DEST_DIR}/${CHART_NAME}-${VERSION}.tgz" \
              "${OCI_BASE}" 2>&1) || { echo "${PUSH_OUT}"; exit 1; }
            echo "${PUSH_OUT}"

            # Tolerant digest parse: case-insensitive, allows leading whitespace.
            DIGEST=$(printf '%s\n' "${PUSH_OUT}" \
              | awk 'tolower($1)=="digest:"{print $2; exit}')
            if [[ -z "${DIGEST}" ]]; then
              echo "::error::helm push for ${CHART_NAME} succeeded but no digest found in output"
              exit 1
            fi

            cosign sign --yes "${IMAGE_BASE}/${CHART_NAME}@${DIGEST}"

            echo "::endgroup::"
          done
