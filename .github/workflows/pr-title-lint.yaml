name: pr-title-lint

# Enforce Conventional Commit PR titles so release-please can parse changes.
#
# Runs on `pull_request`, not `pull_request_target`: GitHub blocks the latter
# on public repositories by default
# (https://gh.io/securely-using-pull_request_target), and this check needs no
# write access or secrets: it only reads the PR, so the read-only token that
# same-repo and fork PRs both receive is enough.
# Failures are reported in the job summary and as annotations rather than PR
# comments, which would need `pull-requests: write`.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in PR title "{title}" must start with a
            lowercase letter (imperative mood, no trailing period).

      - name: Check scope matches changed components
        if: success()
        id: scope-check
        # Advisory step: failures (gh API rate limit, network error, bash error)
        # must not block PRs. release-please routes commits to changelogs by
        # file path, so a scope label that does not match changed files yields
        # a misleading changelog entry. Backend lives at the repo root, so only
        # the `studio/` subtree is checked here.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          title="$PR_TITLE"

          scope_re='^[a-z]+\(([^)]+)\)'
          scope=""
          if [[ "$title" =~ $scope_re ]]; then
            scope="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$scope" ]]; then
            echo "No scope in title — skipping cross-component check"
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only studio is a distinct subtree; everything else is backend (root).
          components=("studio")

          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          declare -A touched
          for f in $files; do
            for comp in "${components[@]}"; do
              if [[ "$f" == "${comp}/"* ]]; then
                touched["$comp"]=1
              fi
            done
          done

          is_component_scope=false
          for comp in "${components[@]}"; do
            if [[ "$scope" == "$comp" ]]; then
              is_component_scope=true
              break
            fi
          done

          if [[ "$is_component_scope" == "true" && -z "${touched[$scope]+x}" ]]; then
            echo "::warning::PR scope is '$scope' but no files in $scope/ were changed. The changelog entry will have a misleading label."
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            echo "reason=Scope **$scope** but no files in \`$scope/\` were changed." >> "$GITHUB_OUTPUT"
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report scope mismatch
        if: steps.scope-check.outputs.mismatch == 'true'
        env:
          REASON: ${{ steps.scope-check.outputs.reason }}
        run: |
          {
            cat <<'MD'
          ## Scope vs. changed files mismatch

          MD
            printf '%s\n' "$REASON"
            cat <<'MD'

          release-please routes commits to changelogs by **file path**, not by scope — so changelog entries will have a misleading scope label.

          **To fix:** either remove the scope (e.g. `fix: ...`) so the label is neutral, or split the changes into separate PRs per component.
          MD
          } >> "$GITHUB_STEP_SUMMARY"

      # On failure, explain the required format in the job summary (linked
      # from the failed check). The action itself reports the specific
      # reason as an error annotation; it exposes no output to reuse here.
      - name: Explain failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            cat <<'MD'
          ## PR title must follow Conventional Commits

          release-please uses PR titles on `main` to determine version bumps and changelog entries.

          The specific reason is shown in this check's annotations (set by `action-semantic-pull-request`).

          ```
          <type>[optional scope][!]: <subject>
          ```

          - `type`: `feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `revert`
          - `subject`: start lowercase, imperative mood, no trailing period
          - breaking change: add `!` (or `BREAKING CHANGE:` in body)

          Examples:
          - ✅ `feat: add search page`
          - ✅ `fix: correct broken nav link`
          - ❌ `Add search page`
          - ❌ `feat: Add search page`

          Edit the PR title in GitHub; this check reruns automatically.
          MD
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=PR title must follow Conventional Commits::Edit the PR title to match <type>[optional scope][!]: <subject>. See this run's summary for the format and examples."
